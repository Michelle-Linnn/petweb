<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAWBOX | 神秘宠物盲盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 高端色板 */
    --box-dark: #1A0A00; /* 深褐黑色，代表神秘 */
    --box-lid: #2D1200; /* 稍微亮一点的顶部 */
    --coral-neon: #FF8C6B; /* 霓虹珊瑚色，主导惊喜 */
    --gold-neon: #D4A017; /* 金色，代表稀有 */
    --sky-glow: #C8E6FF; /* 天蓝色晕 */
    --text-cream: #FFF8F0; /* 奶油白文字 */
    
    --font-display: 'Playfair Display', serif;
    --font-body: 'Noto Sans SC', sans-serif;
    
    /* 霓虹光影 */
    --shadow-coral: 0 0 20px rgba(255, 140, 107, 0.7), 0 0 40px rgba(255, 140, 107, 0.3);
    --shadow-gold: 0 0 15px rgba(212, 160, 23, 0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050200; /* 极黑背景，突出盒子 */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: var(--font-body);
    overflow: hidden;
    color: var(--text-cream);
  }

  /* 背景星尘效果 */
  body::before {
    content: '';
    position: absolute;
    width: 200%; height: 200%;
    background-image: 
      radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
      radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
      radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
    background-size: 550px 550px, 350px 350px, 250px 250px;
    background-position: 0 0, 40px 60px, 130px 270px;
    animation: stardust 100s linear infinite;
    opacity: 0.3;
    z-index: 0;
  }

  @keyframes stardust {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* 盲盒容器（控制整体透视） */
  .box-container {
    position: relative;
    width: 320px;
    height: 320px;
    perspective: 1000px; /* 3D 透视 */
    z-index: 10;
    cursor: pointer;
  }

  /* 盒子主体（正方形） */
  .mystery-box {
    width: 100%;
    height: 100%;
    background-color: var(--box-dark);
    border-radius: 24px; /* 稍微圆润的角，更友好 */
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* 带有弹性的旋转 */
    
    /* 盒子的厚度感和霓虹地盘光晕 */
    box-shadow: 
      inset 0 2px 0 rgba(255,255,255,0.05), /* 顶部微光 */
      0 10px 0 #000, /* 底部厚度 */
      0 20px 50px rgba(0,0,0,0.8), /* 基础阴影 */
      0 30px 80px rgba(255, 140, 107, 0.2), /* 底部霓虹晕 */
      0 0 10px rgba(212, 160, 23, 0.1); /* 金色微光 */
    
    overflow: hidden;
  }

  /* 鼠标悬停时的动态效果 */
  .box-container:hover .mystery-box {
    transform: rotateY(-10deg) rotateX(5deg) translateY(-10px);
  }

  /* 盒子顶部（盖子线） */
  .mystery-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 60px;
    background-color: var(--box-lid);
    border-radius: 24px 24px 0 0;
    border-bottom: 2px solid rgba(255, 140, 107, 0.15); /* 霓虹切割线 */
    z-index: 1;
  }

  /* 盒子内容区 */
  .box-content {
    position: absolute;
    inset: 60px 20px 20px 20px; /* 避开盖子 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* 中心神秘问号图案 */
  .mystery-symbol {
    font-family: var(--font-display);
    font-size: 140px;
    font-weight: 900;
    color: var(--coral-neon);
    text-shadow: var(--shadow-coral);
    position: relative;
    line-height: 1;
    margin-bottom: 10px;
    animation: symbol-pulse 2s ease-in-out infinite;
  }
  
  /* 问号下方的猫爪 */
  .mystery-symbol::after {
    content: '🐾';
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%) scale(0.4);
    font-size: 50px;
    color: var(--gold-neon);
    text-shadow: var(--shadow-gold);
    opacity: 0.8;
  }

  @keyframes symbol-pulse {
    0%, 100% { transform: scale(1); opacity: 1; text-shadow: var(--shadow-coral); }
    50% { transform: scale(1.05); opacity: 0.9; text-shadow: 0 0 30px rgba(255, 140, 107, 0.9), 0 0 60px rgba(255, 140, 107, 0.5); }
  }

  /* 盒子下方的文字 */
  .box-label {
    text-align: center;
  }

  .label-title {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--text-cream);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    position: relative;
    display: inline-block;
  }
  /* 文字两侧的小装饰 */
  .label-title::before, .label-title::after {
    content: '✨';
    font-size: 12px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.6;
  }
  .label-title::before { left: -25px; }
  .label-title::after { right: -25px; }

  .label-subtitle {
    font-size: 12px;
    color: rgba(255,248,240,0.5);
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }

  /* 盒子周围漂浮的神秘元素装饰 */
  .floating-deco {
    position: absolute;
    font-size: 24px;
    opacity: 0.15;
    color: var(--sky-glow);
    text-shadow: 0 0 10px var(--sky-glow);
    animation: float-around 6s linear infinite;
    pointer-events: none;
    z-index: 1;
  }

  .deco-1 { top: 10%; left: 10%; animation-delay: 0s; } /* 骨头 */
  .deco-2 { top: 20%; right: 15%; animation-delay: 1.5s; font-size: 20px; } /* 铃铛 */
  .deco-3 { bottom: 15%; left: 20%; animation-delay: 3s; font-size: 28px; } /* 鱼 */
  .deco-4 { bottom: 25%; right: 10%; animation-delay: 4.5s; } /* 爪子 */

  @keyframes float-around {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.15; }
    90% { opacity: 0.15; }
    100% { transform: translate(20px, -30px) rotate(10deg); opacity: 0; }
  }

  /* 点击时的提示文字 */
  .click-prompt {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: var(--gold-neon);
    letter-spacing: 0.1em;
    opacity: 0.7;
    white-space: nowrap;
    animation: prompt-fade 2s infinite;
  }

  @keyframes prompt-fade {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.8; }
  }

</style>
</head>
<body>

  <div class="floating-deco deco-1">🦴</div>
  <div class="floating-deco deco-2">🔔</div>
  <div class="floating-deco deco-3">🐟</div>
  <div class="floating-deco deco-4">🐾</div>

  <div class="box-container">
    <div class="mystery-box">
      <div class="box-content">
        <div class="mystery-symbol">?</div>
        
        <div class="box-label">
          <div class="label-title">神秘宠物盲盒</div>
          <div class="label-subtitle">Premium Mystery Paw</div>
        </div>
      </div>
    </div>
    <div class="click-prompt">点击开启惊喜</div>
  </div>

</body>
</html>
